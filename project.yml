name: PontosLoop
options:
  bundleIdPrefix: com.nicholasbirochi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
packages:
  DecisionCore:
    path: Packages/DecisionCore
targets:
  PontosLoop-iOS:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.compraclara.ios
        PRODUCT_NAME: PontosLoop
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Pontos Loop
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: DecisionCore
  PontosLoop-macOS:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.compraclara.macos
        PRODUCT_NAME: PontosLoop
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_KEY_CFBundleDisplayName: Pontos Loop
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Config/PontosLoop-macOS.entitlements
    dependencies:
      - package: DecisionCore
  PontosLoop-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.compraclara.uitests
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: PontosLoop-iOS
schemes:
  PontosLoop-iOS:
    build:
      targets:
        PontosLoop-iOS: all
    run:
      config: Debug
    test:
      targets:
        - PontosLoop-UITests
  PontosLoop-macOS:
    build:
      targets:
        PontosLoop-macOS: all
    run:
      config: Debug
