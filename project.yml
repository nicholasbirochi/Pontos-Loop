name: CompraClara
options:
  bundleIdPrefix: com.nicholasbirochi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  DecisionCore:
    path: Packages/DecisionCore
targets:
  CompraClara-iOS:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.compraclara.ios
        PRODUCT_NAME: CompraClara
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: CompraClara
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: DecisionCore
  CompraClara-macOS:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.compraclara.macos
        PRODUCT_NAME: CompraClara
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Config/CompraClara-macOS.entitlements
    dependencies:
      - package: DecisionCore
  CompraClara-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasbirochi.compraclara.uitests
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: CompraClara-iOS
schemes:
  CompraClara-iOS:
    build:
      targets:
        CompraClara-iOS: all
    run:
      config: Debug
    test:
      targets:
        - CompraClara-UITests
  CompraClara-macOS:
    build:
      targets:
        CompraClara-macOS: all
    run:
      config: Debug
